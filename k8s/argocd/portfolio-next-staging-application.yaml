apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-next-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CyrilDesch/portfolio-next.git
    targetRevision: deploy-staging
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
