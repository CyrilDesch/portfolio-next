apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-next-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CyrilDesch/portfolio-next.git
    targetRevision: production
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

