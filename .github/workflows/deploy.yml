name: Linter and Build

on:
  push:
    branches:
      - staging
      - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn run npm-run-all lint-check:*

  build-and-push:
    needs: linter
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_HOST=${{ vars.REACT_APP_HOST }}
            REACT_APP_GA_MEASUREMENT_ID=${{ vars.REACT_APP_GA_MEASUREMENT_ID }}

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Kubernetes manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="sha-${SHORT_SHA}"

          if [[ "${{ github.ref }}" == "refs/heads/production" ]]; then
            OVERLAY="production"
            DEPLOY_TAG="deploy-production"
          else
            OVERLAY="staging"
            DEPLOY_TAG="deploy-staging"
          fi

          echo "Updating image tag to ${IMAGE_TAG} in k8s/overlays/${OVERLAY}"

          cd k8s/overlays/${OVERLAY}
          # We target the base image name used in base/deployment.yaml
          kustomize edit set image ghcr.io/cyrildesch/portfolio-next=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          cd ../../..

          git add k8s/overlays/${OVERLAY}/kustomization.yaml

          # Commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update ${OVERLAY} image tag to ${IMAGE_TAG} [skip ci]"
          fi

          # Tag the commit
          git tag -f ${DEPLOY_TAG}

          # Push changes and tag
          git push origin HEAD:${{ github.ref_name }}
          git push -f origin ${DEPLOY_TAG}
